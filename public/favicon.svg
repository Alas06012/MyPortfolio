<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18182b"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.2"/>
    </linearGradient>

    <!-- D Letter Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <!-- Dot Gradient -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="12" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Geometric Modern 'D' -->
  <path
    fill="url(#letterGrad)"
    fill-rule="evenodd"
    d="M 13 12 H 23 C 29.627 12 35 17.373 35 24 C 35 30.627 29.627 36 23 36 H 13 Z M 18.5 17.5 H 22.5 C 26.09 17.5 29 20.41 29 24 C 29 27.59 26.09 30.5 22.5 30.5 H 18.5 Z"
  />

  <!-- Signature Brand Accent Dot -->
  <circle cx="36" cy="12" r="3" fill="url(#dotGrad)"/>
</svg>
